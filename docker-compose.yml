services:
    phoenix-down-build:
        build:
            context: .
            dockerfile: Dockerfile
        image: phoenix-down-build
        working_dir: /workspace
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        environment:
            HOME: /workspace
            ANDROID_SDK_ROOT: /opt/android-sdk
            ANDROID_HOME: /opt/android-sdk
            ANDROID_USER_HOME: /workspace/.android
            GRADLE_USER_HOME: /workspace/.gradle-cache
            CI: "true"
            BUILD_VARIANT: "${BUILD_VARIANT:-freeBundleRelease}"
            VARIANT_LABEL: "${VARIANT_LABEL:-freeBundleRelease}"
        volumes:
            - android-sdk-cache:/opt/android-sdk
            - ./src:/workspace
            - ./releases:/workspace/releases
        command: [ "bash", "/workspace/scripts/build-release-inside.sh" ]

volumes:
    android-sdk-cache:
